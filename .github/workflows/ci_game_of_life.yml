name: Game of life testing

on: push

jobs:
  game-of-life-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: ['17', '21', '25']

    steps:
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.8.2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Java version
        run: java -version
      
      - name: Maven version
        run: mvn --version
      
      - name: Checkout repo
        uses: actions/checkout@v6
      
      - name: Maven test
        run: mvn test
